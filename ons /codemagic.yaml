workflows:
  ons-android-release:
    name: Build Ons App APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - cd ons
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - ons/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
