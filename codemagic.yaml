workflows:
  ons-android-release:
    name: Build Ons App
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: 1. Enter ons folder
        script: |
          cd ons
      - name: 2. Get packages
        script: |
          flutter clean
          flutter pub get
      - name: 3. Build APK
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - "ons/build/app/outputs/flutter-apk/*.apk"