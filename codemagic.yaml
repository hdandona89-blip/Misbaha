workflows:
  misbaha-android-release:
    name: Build Misbaha App APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
    environment:
      flutter: stable
    scripts:
      - cd ons
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - ons/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - hdandona89@gmail.com